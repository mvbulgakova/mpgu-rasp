name: Scrape Admissions Data

# ⚠ ВОРКФЛОУ ПРИЁМНОЙ КАМПАНИИ, А НЕ РАСПИСАНИЯ.
# Приехал сюда целиком при миграции, но модули, которые он зовёт, в этом
# репозитории отсутствуют — значит он падал на каждом запуске. Крон снят:
# гарантированно падающий воркфлоу по расписанию — это только шум в Actions
# и ложный сигнал «в репозитории всё красное». Ручной запуск оставлен.
#
# Приёмка живёт и работает ОТДЕЛЬНО. Если однажды решите перенести её сюда —
# сначала портируйте модули scraper.*, потом возвращайте крон.

on:
  # schedule:  # снят — см. примечание вверху файла
  #  - cron: "0 6 * * *"   # 09:00 МСК ежедневно
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: data
          path: .data-wt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          DATA_PATH: .data-wt
        run: python scraper/admission_scraper.py

      - name: Commit and push to data branch
        run: |
          cd .data-wt
          git config user.email "bot@mpgu-rasp"
          git config user.name "mpgu-bot"
          git add -A
          git diff --staged --quiet || git commit -m "admissions: auto-update $(date -u +%Y-%m-%d)"
          git push origin data
