name: Schedule Bot (polling)

# Бот РАСПИСАНИЯ. Не путать с ботом приёмной кампании — это разные боты с
# разными токенами, и живут они в разных репозиториях. Здесь только
# расписание: группы, пары, обратная связь об ошибках.
#
# Раньше на этом месте лежал воркфлоу бота приёмки, приехавший при миграции
# целиком: с режимами seats_increased / quota / correction, кэшем подписок
# «следи за кодом» и ANTHROPIC_API_KEY. Все четыре режима звали модули
# scraper.notify_*, которых в этом репозитории нет вовсе, то есть падали
# гарантированно. Убраны — вместе с поводом однажды запустить их и решить,
# что что-то сломалось у приёмки.
#
# Хостинга нет: запуск опрашивает Telegram ~5.5 часов и выходит, крон
# перезапускает. Планировщик GitHub пропускает кроны в часы пик, поэтому
# раны длинные, а частые кроны служат «подхватом»: пока ран идёт, новый
# триггер ЖДЁТ в очереди (cancel-in-progress: false) и стартует сразу после.
#
# Нужен один секрет: BOT_TOKEN — токен бота РАСПИСАНИЯ от @BotFather.
# GITHUB_TOKEN для обратной связи раннер выдаёт сам.
#
# ВАЖНО: этот бот и cloudflare-worker-bot взаимно исключают друг друга —
# Telegram отдаёт обновления либо через getUpdates, либо на вебхук. Если
# запустить deploy-bot.yml тем же токеном, polling здесь замолчит.

on:
  schedule:
    - cron: "0 * * * *"   # каждый час (сработает — встанет в очередь)
  workflow_dispatch:

# НЕ отменяем работающий ран: новый ждёт в очереди и подхватывает сразу после.
concurrency:
  group: telegram-bot-poll
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # обратная связь из бота заводит issue в этом же репозитории

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Зависимостей нет: бот расписания живёт на стандартной библиотеке.

      - name: Run bot (long-polling)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Инбокс обратной связи — Issues этого же репозитория. Отдельный
          # PAT не нужен: встроенного GITHUB_TOKEN с issues:write хватает,
          # и он живёт только на время рана.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SECONDS: "19800"
          PYTHONUNBUFFERED: "1"   # реальные метки времени в логах, а не всё при выходе
        run: python -m scraper.telegram_bot
